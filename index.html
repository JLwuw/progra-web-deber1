<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">

    <title>Deber 1</title>
</head>

<body>
    <div class="container py-5">
        <h1 class="display-4 text-center fw-bold">
            Tablero de Hábitos
        </h1>
    </div>

    <div class="container py-5">
        <div class="row">
            <div class="col-7 card mx-1">
                <div class="card-body ">
                    <h5 class="card-title pb-2">
                        Hábitos
                    </h5>
                    <ul class="habits-list px-0" id="habits-list">
                    </ul>
                </div>
            </div>
            <div class="col-4 card mx-1">
                <div class="card-body ">
                    <h5 class="card-title">
                        Nuevo Hábito
                    </h5>
                    <form>
                        <div class="mb-3">
                            <label for="habit-name" class="form-label pt-1">Descripción: </label>
                            <input
                            type="text"
                            class="form-control"
                            id="habit-name"
                            placeholder="Tender la cama..."
                            >
                        </div>

                        <button type="submit" class="btn btn-primary pt-1" id="add-button">
                            Añadir
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
